name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK Tools
        uses: android-actions/setup-android@v3

      - name: Setup & Sync Capacitor Android
        run: |
          if [ ! -d "android" ] || [ ! -f "android/gradlew" ]; then
            echo "Android folder or gradlew not found in repo. Initializing Capacitor Android..."
            rm -rf android
            npx cap add android
          fi
          npx cap sync android
          ls -la android

      - name: Build Debug APK via Gradle
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK as Downloadable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jee-core-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
